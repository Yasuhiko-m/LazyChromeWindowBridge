name: Publish Chrome Web Store

on:
  workflow_dispatch:
    inputs:
      version:
        description: Immutable release tag (vX.Y.Z)
        required: true
        type: string

permissions: {}

concurrency:
  group: publish-cws-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'Yasuhiko-m/LazyChromeWindowBridge' &&
      github.ref == format('refs/tags/{0}', inputs.version)
    runs-on: windows-2025
    environment: release
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout immutable dispatched tag
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify immutable tag and resolved product version
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = '${{ inputs.version }}'
          if ($tag -notmatch '^v(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)$') { throw 'Version must be a stable vX.Y.Z tag.' }
          if ($env:GITHUB_REF -cne "refs/tags/$tag") { throw 'Dispatch ref is not the requested immutable tag.' }
          $head = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $head -cne $env:GITHUB_SHA) { throw 'Checkout SHA mismatch.' }
          $release = ./Scripts/Internal/Resolve-ReleaseVersion.ps1 -SourceRoot $PWD
          if ($release.Tag -cne $tag) { throw 'Source product version does not match requested tag.' }

      - name: Setup Node for deterministic extension tests
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24.19.0'

      - name: Test and package matching extension
        run: |
          $ErrorActionPreference = 'Stop'
          node --test ./tests/LazyChromeWindowBridge.Extension.Tests/bindings.test.mjs ./tests/LazyChromeWindowBridge.Extension.Tests/monitor.test.mjs ./tests/LazyChromeWindowBridge.Extension.Tests/downloads.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Extension tests failed.' }
          ./Scripts/Package-Extension.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Extension package failed.' }
          node ./Scripts/Internal/AuditPublicRelease.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Extension/package audit failed.' }

      - name: Upload and submit existing CWS item for normal review
        env:
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
          CWS_SERVICE_ACCOUNT_JSON: ${{ secrets.CWS_SERVICE_ACCOUNT_JSON }}
        run: ./Scripts/Internal/Publish-Cws.ps1 -SourceRoot $PWD -Version '${{ inputs.version }}'
